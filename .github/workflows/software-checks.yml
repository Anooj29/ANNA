name: Hospital software checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: anna_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dashboard.txt
      - name: Python syntax and isolated integration tests
        env:
          DB_ENGINE: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: anna_ci
          DASHBOARD_SESSION_SECRET: ci-only-session-secret-with-adequate-length
          ROBOT_API_KEY: ci-only-robot-key
        run: |
          python -m compileall -q backend dashboards database
          python -m unittest discover -s tests -v
      - name: Dashboard JavaScript syntax
        run: |
          node --check dashboards/clinician/static/app.js
          node --check dashboards/clinician/static/workspace.js
          node --check dashboards/clinician/static/notifications.js
          node --check dashboards/clinician/static/operations.js
          node --check dashboards/receptionist/static/app.js
          node --check dashboards/patient/static/app.js
          node --check dashboards/patient/static/i18n.js
