# PostgreSQL is required. Use this service or an existing PostgreSQL server.
services:
  postgres:
    image: postgres:16-alpine
    container_name: anna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anna_hospital}
      POSTGRES_USER: ${POSTGRES_USER:-anna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - anna_postgres_data:/var/lib/postgresql/data

volumes:
  anna_postgres_data:
